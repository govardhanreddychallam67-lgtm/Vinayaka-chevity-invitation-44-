*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans Telugu","Nirmala UI","Segoe UI",sans-serif;
  background:#050302;color:#fff4d6;line-height:1.6;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
  background-image:radial-gradient(#ffd36a 1px,transparent 1px);
  background-size:28px 28px;z-index:-2;
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 20%,rgba(255,159,25,.15),transparent 38%),
             radial-gradient(circle at 50% 80%,rgba(125,35,10,.16),transparent 40%);
}
.container{width:min(94%,760px);margin:auto}
nav{
  position:sticky;top:0;z-index:50;background:rgba(7,4,2,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,190,65,.28);
}
.navin{display:flex;justify-content:space-between;align-items:center;padding:12px 4px}
.brand{font-weight:900;letter-spacing:1px;color:#ffd36b;font-size:15px}
.navlinks{display:flex;gap:10px}
.navlinks a{color:#ffe8b0;text-decoration:none;font-size:12px;padding:7px 9px;border-radius:20px}
.navlinks a:hover{background:#2a1707}
.hero{padding:34px 0 22px;text-align:center}
.om{font-size:28px;color:#ffc44e}
.kicker{font-size:13px;letter-spacing:2px;color:#dca64b;margin-top:3px;font-weight:700}
h1{
  font-size:clamp(30px,8vw,58px);line-height:1.05;margin:8px 0 8px;
  color:#ffd86e;text-shadow:0 3px 18px #7c3900;font-weight:1000;
}
.subtitle{font-size:clamp(17px,4.5vw,25px);color:#fff0c7;font-weight:700}
.hero-card{
  margin:22px auto 0;max-width:560px;padding:9px;border-radius:25px;
  background:linear-gradient(135deg,#5d2b08,#e7a934,#4b2108);
  box-shadow:0 0 35px rgba(255,160,30,.18);
}
.hero-card img{display:block;width:100%;border-radius:18px}
.invite{
  text-align:center;margin:22px auto 30px;padding:22px 18px;border-radius:22px;
  border:1px solid rgba(255,196,78,.35);
  background:linear-gradient(145deg,rgba(57,27,8,.8),rgba(20,9,4,.9));
}
.invite strong{display:block;color:#ffd36b;font-size:25px;margin-bottom:7px}
.invite p{font-size:16px;color:#ffeac0}

.committee{
  text-align:center;margin:18px auto 30px;padding:26px 16px;border-radius:22px;
  border:2px solid rgba(255,196,78,.45);
  background:linear-gradient(145deg,rgba(57,27,8,.92),rgba(20,9,4,.96));
  box-shadow:0 0 28px rgba(255,160,30,.16);
}
.committee .small{font-size:clamp(18px,5vw,28px);font-weight:900;color:#fff0c7;letter-spacing:1px}
.committee .big{display:block;font-size:clamp(30px,8vw,52px);line-height:1.05;color:#ffd36b;text-shadow:0 3px 18px #7c3900;font-weight:1000;margin:5px 0}
.committee .members{font-size:clamp(20px,5.5vw,32px);font-weight:900;color:#ffe8b0;letter-spacing:1px}
section{padding:20px 0 38px}
.section-title{text-align:center;color:#ffd36b;font-size:25px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{
  background:linear-gradient(145deg,rgba(57,28,9,.9),rgba(17,8,4,.95));
  border:1px solid rgba(255,188,55,.25);border-radius:18px;padding:17px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}
.card .icon{font-size:25px}
.card h3{font-size:15px;color:#ffd46e;margin:4px 0}
.card p{font-size:14px;color:#f6dfb0}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.timebox{
  text-align:center;padding:15px 5px;border-radius:16px;
  background:#160a04;border:1px solid #6c3b0e;
}
.timebox b{display:block;font-size:28px;color:#ffd05b}
.timebox span{font-size:11px;color:#d7b77d}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{
  border:0;border-radius:15px;padding:13px 8px;font-weight:800;
  font-family:inherit;cursor:pointer;text-decoration:none;text-align:center;
  color:#170900;background:linear-gradient(135deg,#ffd86e,#c88319);
}
.btn.secondary{color:#ffe8b0;background:#211006;border:1px solid #70400f}
.map{width:100%;height:180px;border:0;border-radius:18px;opacity:.9}
footer{text-align:center;padding:28px 10px 40px;color:#b9945c;font-size:12px}
.flower{position:fixed;top:-30px;font-size:17px;opacity:.7;pointer-events:none;z-index:5;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
.lamp{position:fixed;bottom:12px;left:12px;font-size:23px;filter:drop-shadow(0 0 8px #ffb52e);opacity:.8}
@media(max-width:430px){
 .navlinks a{font-size:10px;padding:6px}
 .grid{grid-template-columns:1fr}
 .actions{grid-template-columns:1fr}
 .countdown{gap:5px}
 .timebox b{font-size:23px}
}
